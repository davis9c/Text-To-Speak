# =============================================================================
# Announcement Server - Configuration
# =============================================================================
# File ini adalah sumber konfigurasi utama aplikasi.
# Nilai di sini dapat di-override lewat environment variable dengan prefix
# APP_ dan nested delimiter "__", contoh:
#   APP_SERVER__PORT=9000
#   APP_LOGGING__LEVEL=DEBUG
# =============================================================================

app:
  name: "Announcement Server"
  description: "Production Ready Text-to-Speech Announcement Server untuk sistem Public Address (TOA)."
  environment: "development"   # development | staging | production

server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR | CRITICAL
  directory: "logs"
  filename: "announcement_server.log"
  max_bytes: 10485760          # 10 MB
  backup_count: 5
  json_format: false

tts:
  engine: "piper"                              # Nama engine aktif (harus terdaftar di EngineFactory)
  piper_binary_path: "engines/piper/piper.exe"  # Path ke executable Piper (unduh terpisah, lihat README)
  piper_models_dir: "engines/piper/models"      # Direktori berisi <voice>.onnx + <voice>.onnx.json
  default_voice: "en_US-lessac-medium"          # Voice default jika request tidak menyebutkan voice
  generation_timeout_seconds: 30.0              # Timeout sintesis per item
  cache_dir: "cache/audio"                      # Direktori cache audio (key: SHA256)

playback:
  default_device_id: null                       # null = pakai default output device Windows. Lihat GET /devices untuk id.
  post_playback_delay_seconds: 0.5               # Jeda (detik) antar pengumuman pada pipeline Worker (Phase 5). 0 = tanpa jeda.

queue:
  max_size: 100                # Maksimum item PENDING secara bersamaan
  max_history: 1000            # Maksimum riwayat item final disimpan di memory

# =============================================================================
# Announcement Engine (Phase 7)
# =============================================================================
# Selain TTS, server dapat memutar file audio yang SUDAH ADA di disk (bell,
# alarm, jingle, atau file WAV/MP3 apa pun) lewat POST /speak dengan
# {"type": "audio", "file": "sounds/bell.mp3"}. File .wav diputar langsung
# tanpa ffmpeg; format lain (mis. .mp3) dikonversi ke WAV lewat ffmpeg dan
# hasilnya di-cache (lihat converted_cache_dir) supaya tidak dikonversi
# ulang setiap kali diputar. ffmpeg BERSIFAT OPSIONAL (graceful
# degradation, sama seperti Piper) — lihat bagian "Setup ffmpeg" README.
announcement:
  sounds_dir: "sounds"                          # Direktori file audio statis (bell/alarm/jingle/dst)
  ffmpeg_binary_path: "ffmpeg"                   # Path ke executable ffmpeg, atau "ffmpeg" jika sudah ada di PATH
  converted_cache_dir: "cache/announcement_audio" # Cache hasil konversi ffmpeg ke WAV
  conversion_timeout_seconds: 30.0               # Timeout konversi ffmpeg per file

# =============================================================================
# Zones (Phase 6 — Multi Zone)
# =============================================================================
# Zone 'main' SELALU otomatis dibuat dari 'playback'/'queue' di atas dan
# TIDAK BOLEH dihapus (dipakai oleh /speak, /queue, /devices, dst — lihat
# README). Zone lain di bawah ini bersifat opsional: dibuat otomatis saat
# startup, dan juga bisa dibuat/diubah/dihapus saat runtime lewat REST API
# (POST/PUT/DELETE /zones) tanpa perlu mengedit file ini.
#   device_id : ID output device (lihat GET /devices). null = belum dipilih.
#   enabled   : jika false, zone dibuat tapi worker-nya tidak memproses antrean.
#   volume    : volume/gain khusus zone ini (0.0 - 2.0), seperti volume knob
#               per-channel amplifier TOA.
zones:
  lobby:
    device_id: null
    enabled: false
    volume: 1.0

  produksi:
    device_id: null
    enabled: false
    volume: 1.0

# =============================================================================
# Scheduler (Phase 8)
# =============================================================================
scheduler:
  poll_interval_seconds: 5.0   # Seberapa sering jadwal jatuh tempo diperiksa
  timezone: "local"            # "local" (jam sistem) atau nama zona IANA, mis. "Asia/Jakarta"

# Jadwal statis (opsional) — dibuat otomatis saat startup. Jadwal juga bisa
# dibuat/diubah/dihapus secara dinamis lewat REST API (/scheduler) tanpa
# restart server, persis seperti Zone (Phase 6). Contoh di bawah mengikuti
# ROADMAP.md Phase 8: 07.00 -> Bell, 12.00 -> Istirahat, 15.00 -> Pulang.
# SENGAJA `enabled: false` secara default (sama seperti contoh zones: di
# atas) — aktifkan (`enabled: true`) setelah menyiapkan sounds/bell.wav
# dan menyesuaikan zone tujuan sesuai kebutuhan.
schedules:
  bell_masuk:
    enabled: false
    zone: "main"
    recurrence: "daily"
    time_of_day: "07:00"
    announcement:
      type: "audio"
      file: "bell.wav"
      priority: "high"

  istirahat:
    enabled: false
    zone: "main"
    recurrence: "weekly"
    time_of_day: "12:00"
    days_of_week: [0, 1, 2, 3, 4]   # Senin(0) - Jumat(4)
    announcement:
      type: "tts"
      text: "Waktunya istirahat siang."

  pulang:
    enabled: false
    zone: "main"
    recurrence: "daily"
    time_of_day: "15:00"
    announcement:
      type: "tts"
      text: "Jam kerja telah selesai, selamat pulang dan hati-hati di jalan."
